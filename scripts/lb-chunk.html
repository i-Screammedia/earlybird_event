review-modal__school" id="reviewModalSchool"></p>
      </div>
      <div class="review-modal__body" id="reviewModalBody"></div>
    </div>
  </div>

  <!-- 기능별 이미지 갤러리 라이트박스 -->
  <div class="gallery-lightbox" id="galleryLightbox" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="기능 이미지 확대 보기">
    <div class="gallery-lightbox__backdrop" id="galleryLightboxBackdrop"></div>
    <button type="button" class="gallery-lightbox__close" id="galleryLightboxClose" aria-label="닫기">×</button>
    <button type="button" class="gallery-lightbox__nav gallery-lightbox__nav--prev" id="galleryLightboxPrev" aria-label="이전 이미지">‹</button>
    <button type="button" class="gallery-lightbox__nav gallery-lightbox__nav--next" id="galleryLightboxNext" aria-label="다음 이미지">›</button>
    <div class="gallery-lightbox__viewport" id="galleryLightboxViewport">
      <div class="gallery-lightbox__track" id="galleryLightboxTrack"></div>
    </div>
    <div class="gallery-lightbox__zoombar">
      <button type="button" class="gallery-lightbox__zoom-btn" id="galleryZoomOut" aria-label="축소">−</button>
      <span class="gallery-lightbox__zoom-level" id="galleryZoomLevel">100%</span>
      <button type="button" class="gallery-lightbox__zoom-btn" id="galleryZoomIn" aria-label="확대">+</button>
      <button type="button" class="gallery-lightbox__zoom-reset" id="galleryZoomReset">원래 크기</button>
    </div>
    <p class="gallery-lightbox__zoom-hint">Ctrl + 마우스 휠 또는 이미지 위 휠로 확대/축소 · 드래그로 이동 · 더블클릭 확대</p>
    <p class="gallery-lightbox__counter" id="galleryLightboxCounter">1 / 1</p>
    <p class="gallery-lightbox__caption" id="galleryLightboxCaption"></p>
  </div>

  <script src="script_copy.js"></script>
</body>
</html>
